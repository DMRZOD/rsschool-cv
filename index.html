<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damir Marufjonov - CV</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cv">
      <header>
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="#" class="nav__link">About</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Skills</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Code</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Experiance</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Education</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Language</a>
            </li>
          </ul>
        </nav>
        <div class="profile">
          <div class="profile__wrapper">
            <img
              src="assets/images/avatar.jpg"
              alt="Avatar"
              class="profile__image"
            />
          </div>
          <h1 class="profile__title">Damir Marufjonov</h1>
          <h2 class="profile__subtitle">Frontend Developer</h2>
        </div>
        <div class="contact">
          <a href="#" class="contact__item">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="contact__icon"
            >
              <path
                d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
              />
              <circle cx="12" cy="10" r="3" />
            </svg>
            Tashkent, Uzbekistan
          </a>
          <a href="#" class="contact__item">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="contact__icon"
            >
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
              <rect x="2" y="4" width="20" height="16" rx="2" />
            </svg>
            dmr.marufjonov@gmail.com
          </a>
        </div>
        <div class="social">
          <a href="#" class="social__item social__item_linkedin">
            <img
              src="assets/icons/linkedin.png"
              alt="Linkedin"
              class="social__icon"
            />
            Linkedin
          </a>
          <a href="#" class="social__item social__item_github">
            <img
              src="assets/icons/github.png"
              alt="Github"
              class="social__icon"
            />
            Github
          </a>
          <a href="#" class="social__item social__item_telegram">
            <img
              src="assets/icons/telegram.png"
              alt="Telegram"
              class="social__icon"
            />
            Telegram
          </a>
          <a href="#" class="social__item social__item_discord">
            <img
              src="assets/icons/discord.png"
              alt="Discord"
              class="social__icon"
            />
            Discord
          </a>
        </div>
      </header>
    </div>
  </body>
</html>
